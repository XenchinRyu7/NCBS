openapi: 3.1.0
info:
  title: Nusantara Core Banking System (CBS) — Enterprise & SNAP-BI API
  version: 2.1.0
  summary: Tier-1 Core Banking Double-Entry Ledger, BI-FAST Clearing, Virtual Account & 6-Role RBAC API
  description: |
    Production-grade **Core Banking System (CBS)** backend engineered to **SNAP-BI (Standar Nasional Open API Pembayaran Bank Indonesia)** standards:
    - **Strict Double-Entry General Ledger**: Every transaction posts balanced `DEBIT` and `CREDIT` legs ($\sum \text{Debit} = \sum \text{Credit}$) in integer IDR (`int64`).
    - **6-Role Banking Segregation of Duties (RBAC)**:
      1. `CUSTOMER` (`budi.santoso@cbs-bank.co.id` / `Password#2026` — Rek `5240301001`, PIN `123456`)
      2. `MERCHANT` (`merchant@tokonusantara.co.id` / `Password#2026` — Rek Giro `5240308888`, PIN `888888`)
      3. `TELLER` (`teller@cbs-bank.co.id` / `Password#2026` — Setor & Tarik Tunai)
      4. `CUSTOMER_SERVICE` (`cs@cbs-bank.co.id` / `Password#2026` — Onboarding & Buka Blokir PIN)
      5. `AUDITOR` (`auditor@cbs-bank.co.id` / `Password#2026` — Read-Only Trial Balance & Audit Log OJK)
      6. `ADMIN` (`admin@cbs-bank.co.id` / `Password#2026` atau `X-API-Key: cbs_live_snap_sandbox_2026`)
    - **Multi-Rail Clearing Engine**: **Intrabank Overbooking** (Rp 0 fee), **BI-FAST** (Rp 2.500 fee), **RTGS** (Rp 30.000 fee), **LLG/SKNBI** (Rp 2.900 fee), **Teller Cash Deposit/Withdrawal**, and **Virtual Account Settlement**.
    - **6-Digit PIN & Brute-Force Lockout**: Automatic `PIN_BLOCKED` status after 3 consecutive invalid PIN attempts; unblockable by `CUSTOMER_SERVICE`.
servers:
  - url: /
    description: Production Core Banking Gateway & API
  - url: /trial
    description: Trial Sandbox Gateway (/trial/v1)
  - url: /dev
    description: Developer Sandbox Gateway (/dev/v1)
security:
  - ApiKeyAuth: []
paths:
  /v1/system/health:
    get:
      tags: [System & Ledger Integrity]
      summary: System & General Ledger Trial Balance Health Check
      responses:
        "200":
          description: Core Banking System and General Ledger are healthy
  /v1/system/reset:
    post:
      tags: [System & Ledger Integrity]
      summary: Reset Trial/Dev Sandbox Ledger to Clean Genesis State (/trial/v1/system/reset)
      description: Exclusive to `/trial/v1` and `/dev/v1`. Restores all demo account balances, Virtual Accounts, and General Ledger entries to their initial state.
      responses:
        "200":
          description: Trial Sandbox environment reset successfully
  /v1/auth/roles:
    get:
      tags: [Zero-Trust Auth & RBAC Roles]
      summary: View All 6 Banking Roles, Demo Credentials & Permission Matrix
      description: Explains all 6 roles (`CUSTOMER`, `MERCHANT`, `TELLER`, `CUSTOMER_SERVICE`, `AUDITOR`, `ADMIN`), their demo login emails, and what each role is allowed to do.
      responses:
        "200":
          description: Role directory and permission matrix
  /v1/auth/token:
    post:
      tags: [Zero-Trust Auth & RBAC Roles]
      summary: Login (Issue JWT + Role Permissions + Owned Accounts)
      description: |
        Login menggunakan salah satu akun demo (semua menggunakan password **`Password#2026`**):
        - `budi.santoso@cbs-bank.co.id` (`CUSTOMER` - Rek `5240301001`, PIN `123456`)
        - `siti.rahma@cbs-bank.co.id` (`CUSTOMER` - Rek `5240302002`, PIN `654321`)
        - `merchant@tokonusantara.co.id` (`MERCHANT` - Rek Giro `5240308888`, PIN `888888`)
        - `teller@cbs-bank.co.id` (`TELLER`)
        - `cs@cbs-bank.co.id` (`CUSTOMER_SERVICE`)
        - `auditor@cbs-bank.co.id` (`AUDITOR`)
        - `admin@cbs-bank.co.id` (`ADMIN`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: budi.santoso@cbs-bank.co.id
                password:
                  type: string
                  example: Password#2026
      responses:
        "200":
          description: JWT Access & Refresh token pair issued along with permissions and owned accounts
  /v1/auth/me:
    get:
      tags: [Zero-Trust Auth & RBAC Roles]
      summary: Inspect Current Session Identity, Role Permissions & Owned Accounts
      responses:
        "200":
          description: Current authenticated user profile and permissions
  /v1/auth/refresh:
    post:
      tags: [Zero-Trust Auth & RBAC Roles]
      summary: Rotate Refresh Token (Single-Use JTI Blacklist)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: Rotated JWT token pair
  /v1/auth/sandbox-key:
    post:
      tags: [Zero-Trust Auth & RBAC Roles]
      summary: Generate SNAP-BI Open Banking Partner Key
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                partner_name:
                  type: string
                  example: PT FinTech Nusantara Open Banking
      responses:
        "201":
          description: Salted SHA-256 API Key generated
  /v1/customers/onboard:
    post:
      tags: [CIF & Account Onboarding]
      summary: Open New CIF & 10-Digit Bank Account (Idempotent)
      parameters:
        - name: X-Idempotency-Key
          in: header
          required: true
          schema:
            type: string
          example: idem-onboard-2026-0001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nik, full_name, email, phone_number, password, pin, initial_deposit]
              properties:
                nik:
                  type: string
                  example: "3171041908950009"
                full_name:
                  type: string
                  example: Andi Pratama Wijaya
                email:
                  type: string
                  example: andi.pratama@cbs-bank.co.id
                phone_number:
                  type: string
                  example: "+6281199887766"
                password:
                  type: string
                  example: Password#2026
                account_type:
                  type: string
                  enum: [SAVINGS, SAVINGS_YOUTH, CHECKING, TIME_DEPOSIT]
                  example: SAVINGS
                card_tier:
                  type: string
                  enum: [SILVER, GOLD, PLATINUM, PRIORITY]
                  example: PLATINUM
                pin:
                  type: string
                  example: "112233"
                initial_deposit:
                  type: integer
                  example: 10000000
      responses:
        "201":
          description: CIF and Account created with opening Double-Entry journal
  /v1/accounts:
    get:
      tags: [Accounts, Balance & Statement]
      summary: List Bank Accounts (Own Accounts for Customer, All for Staff)
      parameters:
        - name: include_gl
          in: query
          required: false
          schema:
            type: boolean
          description: Include internal General Ledger accounts (AUDITOR and ADMIN only)
      responses:
        "200":
          description: List of accounts
    post:
      tags: [Accounts, Balance & Statement]
      summary: Open Additional Bank Account for Existing CIF (SAVINGS, CHECKING, TIME_DEPOSIT)
      parameters:
        - name: X-Idempotency-Key
          in: header
          required: true
          schema:
            type: string
          example: idem-open-acc-2026-0001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_type, card_tier, pin, initial_deposit]
              properties:
                cif_number:
                  type: string
                  example: CIF-90010001
                account_type:
                  type: string
                  enum: [SAVINGS, SAVINGS_YOUTH, CHECKING, TIME_DEPOSIT]
                  example: TIME_DEPOSIT
                card_tier:
                  type: string
                  enum: [SILVER, GOLD, PLATINUM, PRIORITY]
                  example: PRIORITY
                pin:
                  type: string
                  example: "123456"
                initial_deposit:
                  type: integer
                  example: 25000000
      responses:
        "201":
          description: Additional bank account created with opening Double-Entry journal
  /v1/accounts/{accountNumber}/balance:
    get:
      tags: [Accounts, Balance & Statement]
      summary: Real-Time Account Balance & Daily Limit Inquiry
      parameters:
        - name: accountNumber
          in: path
          required: true
          schema:
            type: string
          example: "5240301001"
      responses:
        "200":
          description: Real-time balance, hold amount, and remaining daily velocity limit
  /v1/accounts/{accountNumber}/statement:
    get:
      tags: [Accounts, Balance & Statement]
      summary: Account Mutation Statement (Mutasi Rekening DEBIT/CREDIT)
      parameters:
        - name: accountNumber
          in: path
          required: true
          schema:
            type: string
          example: "5240301001"
      responses:
        "200":
          description: Immutable Double-Entry ledger statement for the account
  /v1/accounts/{accountNumber}/unblock-pin:
    post:
      tags: [Customer Service (CS) & Admin Operations]
      summary: Unblock PIN_BLOCKED Account & Reset PIN (CUSTOMER_SERVICE / ADMIN)
      parameters:
        - name: accountNumber
          in: path
          required: true
          schema:
            type: string
          example: "5240301001"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                new_pin:
                  type: string
                  example: "123456"
                reason:
                  type: string
                  example: "Verifikasi e-KTP selesai di meja Customer Service Cabang Sudirman"
      responses:
        "200":
          description: Account PIN unblocked and restored to ACTIVE
  /v1/accounts/{accountNumber}/status:
    patch:
      tags: [Customer Service (CS) & Admin Operations]
      summary: Freeze, Dormant, or Activate Account (CUSTOMER_SERVICE / ADMIN)
      parameters:
        - name: accountNumber
          in: path
          required: true
          schema:
            type: string
          example: "5240302002"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, reason]
              properties:
                status:
                  type: string
                  enum: [ACTIVE, FROZEN, DORMANT, CLOSED]
                  example: FROZEN
                reason:
                  type: string
                  example: "Indikasi transaksi mencurigakan — sementara dibekukan oleh Tim Anti-Fraud"
      responses:
        "200":
          description: Account status updated
  /v1/transactions:
    get:
      tags: [Core Banking Transactions]
      summary: List Transaction History (Filter by Account or Channel)
      parameters:
        - name: account
          in: query
          required: false
          schema:
            type: string
          example: "5240301001"
        - name: channel
          in: query
          required: false
          schema:
            type: string
            enum: [INTRABANK, BI_FAST, RTGS, LLG, VIRTUAL_ACCOUNT, TELLER_DEPOSIT, TELLER_WITHDRAWAL]
      responses:
        "200":
          description: Transaction history retrieved
  /v1/transactions/{referenceNo}:
    get:
      tags: [Core Banking Transactions]
      summary: Get Transaction Receipt & Double-Entry Postings by Reference Number
      parameters:
        - name: referenceNo
          in: path
          required: true
          schema:
            type: string
          example: NCB-GENESIS-OPENING-001
      responses:
        "200":
          description: Transaction receipt and ledger postings
  /v1/admin/dashboard:
    get:
      tags: [General Ledger & OJK Audit]
      summary: Executive Core Banking Command Center Dashboard (ADMIN / AUDITOR)
      description: Monitors Total DPK (Customer Deposits), GL Central Vault Reserve, GL Nostro Clearing, Fee Income Revenue, Channel Volume Breakdown, Flagged/Blocked Accounts Watchlist, and Trial Balance Integrity.
      responses:
        "200":
          description: Executive Core Banking Command Center metrics
  /v1/transactions/transfer:
    post:
      tags: [Core Banking Transactions]
      summary: Execute Fund Transfer (INTRABANK, BI_FAST, RTGS, LLG)
      parameters:
        - name: X-Idempotency-Key
          in: header
          required: true
          schema:
            type: string
          example: idem-transfer-2026-0001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_account_number, destination_account_number, channel, amount, pin]
              properties:
                source_account_number:
                  type: string
                  example: "5240301001"
                destination_account_number:
                  type: string
                  example: "5240302002"
                channel:
                  type: string
                  enum: [INTRABANK, BI_FAST, RTGS, LLG]
                  example: INTRABANK
                external_bank_code:
                  type: string
                  example: ""
                external_account_name:
                  type: string
                  example: ""
                amount:
                  type: integer
                  example: 2500000
                pin:
                  type: string
                  example: "123456"
                description:
                  type: string
                  example: Pembayaran Invoice Project Cloud Architecture
      responses:
        "201":
          description: Transfer settled with balanced DEBIT/CREDIT ledger postings
  /v1/transactions/cash:
    post:
      tags: [Core Banking Transactions]
      summary: Teller Cash Deposit & Withdrawal (TELLER / ADMIN Only)
      parameters:
        - name: X-Idempotency-Key
          in: header
          required: true
          schema:
            type: string
          example: idem-cash-2026-0001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_number, operation, amount]
              properties:
                account_number:
                  type: string
                  example: "5240302002"
                operation:
                  type: string
                  enum: [DEPOSIT, WITHDRAWAL]
                  example: DEPOSIT
                amount:
                  type: integer
                  example: 5000000
                pin:
                  type: string
                  example: "654321"
                description:
                  type: string
                  example: Setor Tunai Teller Cabang Sudirman
      responses:
        "201":
          description: Cash transaction settled against GL Central Vault
  /v1/virtual-accounts:
    post:
      tags: [Virtual Account Billing]
      summary: Generate Virtual Account Bill (MERCHANT / ADMIN Only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [merchant_account_number, merchant_name, customer_phone_or_id, customer_name, bill_amount]
              properties:
                merchant_account_number:
                  type: string
                  example: "5240308888"
                merchant_name:
                  type: string
                  example: PT Toko Nusantara Digital Tbk
                customer_phone_or_id:
                  type: string
                  example: "081299998888"
                customer_name:
                  type: string
                  example: Budi Santoso
                bill_amount:
                  type: integer
                  example: 750000
                description:
                  type: string
                  example: Pembelian SSD NVMe 2TB Enterprise
      responses:
        "201":
          description: Virtual Account created
  /v1/virtual-accounts/{vaNumber}:
    get:
      tags: [Virtual Account Billing]
      summary: Inquiry Virtual Account Bill
      parameters:
        - name: vaNumber
          in: path
          required: true
          schema:
            type: string
          example: "88000081290001001"
      responses:
        "200":
          description: Virtual Account billing details
  /v1/virtual-accounts/{vaNumber}/pay:
    post:
      tags: [Virtual Account Billing]
      summary: Pay Virtual Account Bill (ACID Settlement)
      parameters:
        - name: vaNumber
          in: path
          required: true
          schema:
            type: string
          example: "88000081290001001"
        - name: X-Idempotency-Key
          in: header
          required: true
          schema:
            type: string
          example: idem-vapay-2026-0001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_account_number, pin]
              properties:
                source_account_number:
                  type: string
                  example: "5240301001"
                pin:
                  type: string
                  example: "123456"
      responses:
        "200":
          description: Virtual Account bill paid and settled to Merchant account
  /v1/ledger/trial-balance:
    get:
      tags: [General Ledger & OJK Audit]
      summary: General Ledger Trial Balance (AUDITOR / ADMIN Only)
      responses:
        "200":
          description: Trial balance verification summary
  /v1/audit-logs:
    get:
      tags: [General Ledger & OJK Audit]
      summary: Inspect OJK/BI Regulatory Audit Trail (AUDITOR / ADMIN Only)
      responses:
        "200":
          description: Immutable audit log entries
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: SNAP-BI Partner Key (`cbs_trial_snap_sandbox_2026` for `/trial/v1` & `/dev/v1`, or `cbs_live_snap_sandbox_2026` for `/v1` Production)
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
